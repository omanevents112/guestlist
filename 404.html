<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>Page not found — OmanEvents</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Tajawal:wght@400;500;700&display=swap">
  <style>
    :root { --gold:#c9a227; --gold-soft:#e8d48b; --silver:#c5c5ce; --muted:#a3a3ab; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: #000; color: #f6f6f4; }
    body {
      font-family: Tajawal, "Segoe UI", system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      background:
        radial-gradient(900px 420px at 50% -10%, rgba(201,162,39,0.16), transparent 60%),
        radial-gradient(700px 380px at 100% 110%, rgba(139,21,56,0.22), transparent 55%),
        #000;
      text-align: center;
    }
    .mark {
      width: 72px; height: 72px; margin: 0 auto 1.2rem;
    }
    .kicker { font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--silver); }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600;
      font-size: clamp(2.4rem, 10vw, 3.6rem);
      color: var(--gold);
      margin: 0.4rem 0 0.7rem;
    }
    p { color: var(--muted); max-width: 26rem; margin: 0 auto 1.4rem; line-height: 1.55; }
    a {
      display: inline-block;
      text-decoration: none;
      color: #111;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.78rem;
      padding: 0.9rem 1.3rem;
      border-radius: 999px;
      background: linear-gradient(180deg, #f3e7b3, #c9a227 46%, #8a7018);
    }
    html[lang="ar"] h1 { font-family: Tajawal, sans-serif; font-weight: 700; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 42 42" aria-hidden="true">
      <circle cx="21" cy="21" r="20" fill="#000" stroke="#C9A227" stroke-width="1.2"/>
      <text x="21" y="25.5" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="14" font-weight="700" fill="#C9A227">OE</text>
    </svg>
    <p class="kicker" id="kicker">OmanEvents</p>
    <h1 id="title">This page has left the party</h1>
    <p id="body">The guest list is still open. Head back and reserve your place.</p>
    <a id="link" href="./">Back to the guest list</a>
  </main>
  <script>
    (function () {
      var ar = false;
      try { ar = localStorage.getItem("oe_guestlist_lang") === "ar" || String(navigator.language || "").toLowerCase().indexOf("ar") === 0; } catch (e) {}
      if (!ar) return;
      document.documentElement.lang = "ar";
      document.documentElement.dir = "rtl";
      document.getElementById("title").textContent = "هالصفحة مو هنا";
      document.getElementById("body").textContent = "القست ليست ما زالت مفتوحة. ارجع وسجّل اسمك.";
      document.getElementById("link").textContent = "العودة إلى القست ليست";
    })();
  </script>
</body>
</html>
